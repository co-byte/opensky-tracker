<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Flight Tracker</title>
	<link rel="icon"
		href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23181818'/><circle cx='16' cy='16' r='12.5' fill='none' stroke='%23ededed' stroke-opacity='.3' stroke-width='1.2'/><path d='M16 4l2 8.5 9 6v2.5l-9-2.5-.6 6 3.1 2.2V29L16 27.6 11.5 29v-1.8l3.1-2.2-.6-6-9 2.5v-2.5l9-6z' fill='%23ededed' transform='translate(16 16) rotate(45) scale(.68) translate(-16 -16)'/></svg>" />
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Widgets/widgets.css" />
	<style>
		/* Same color as the globe's base color, so nothing flashes white while tiles load */
		:root {
			color-scheme: dark;
			background: #181818;
		}

		body {
			margin: 0;
		}

		#viewer {
			height: 100dvh;
		}

		/* The compass and the toolbar's home button share one panel that grows out of the right edge with cubic-curve corners, whose curvature changes gradually where an arc's switches abruptly */
		#controls {
			position: fixed;
			top: 50%;
			right: 0;
			z-index: 1;
			box-sizing: border-box;
			display: flex;
			flex-direction: column;
			gap: 6px;
			width: 40px;
			height: 102px;
			padding: 20px 6px;
			transform: translateY(-50%);
			background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 102'><path d='M40 0C40 8 35 14 26 14H20C8 14 0 22 0 34V68C0 80 8 88 20 88H26C35 88 40 94 40 102Z' fill='%23181818' stroke='%23ededed' stroke-opacity='.2'/></svg>") no-repeat;
			filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.5));
		}

		#controls button {
			box-sizing: border-box;
			margin: 0;
			width: 28px;
			height: 28px;
			border: 1px solid rgba(237, 237, 237, 0.2);
			border-radius: 50%;
			padding: 0;
			background: none;
			cursor: pointer;
		}

		#controls button:hover {
			border-color: rgba(237, 237, 237, 0.4);
			background-color: #262628;
		}

		#compass svg {
			display: block;
		}

		/* Cesium's house icon is replaced by a plain ring, and its default blue hover by a neutral one */
		#controls .cesium-viewer-toolbar {
			position: static;
			display: flex;
		}

		#controls .cesium-home-button {
			background: transparent url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='6' fill='none' stroke='%23ededed' stroke-width='1.2'/><circle cx='16' cy='16' r='1.5' fill='%23ededed'/></svg>") center / 100% no-repeat;
			box-shadow: inset 0 1px 0 rgba(237, 237, 237, 0.08);
			transition: border-color 0.2s, background-color 0.2s;
		}

		.cesium-home-button .cesium-svgPath-svg {
			display: none;
		}

		/* The logo is only mandatory for Cesium ion content, which this page does not use; the credits stay behind the link */
		.cesium-credit-logoContainer {
			display: none !important;
		}

		.cesium-viewer-bottom {
			padding: 0 12px 10px;
		}

		.cesium-viewer .cesium-credit-expand-link {
			color: rgba(237, 237, 237, 0.4);
			text-decoration: none;
		}

		.cesium-viewer .cesium-credit-expand-link:hover {
			color: #ededed;
		}

		.cesium-viewer .cesium-credit-lightbox-overlay {
			background-color: rgba(0, 0, 0, 0.6);
		}

		.cesium-viewer .cesium-credit-lightbox {
			border: 1px solid rgba(237, 237, 237, 0.2);
			border-radius: 0;
			background-color: rgba(24, 24, 24, 0.9);
			color: rgba(237, 237, 237, 0.6);
			font-size: 13px;
			line-height: 1.6;
		}

		.cesium-viewer .cesium-credit-lightbox-title {
			color: #ededed;
		}

		.cesium-viewer .cesium-credit-lightbox a {
			color: #ededed;
			text-decoration-color: rgba(237, 237, 237, 0.4);
		}

		.cesium-viewer .cesium-credit-lightbox a:hover {
			text-decoration-color: #c97c3d;
		}

		.cesium-viewer .cesium-credit-lightbox-close {
			top: 10px;
			right: 10px;
			width: 28px;
			height: 28px;
			padding: 0;
			border-radius: 50%;
			line-height: 28px;
			text-align: center;
			text-decoration: none;
		}

		.cesium-viewer .cesium-credit-lightbox-close:hover {
			background-color: #262628;
		}

		.cesium-viewer .cesium-credit-lightbox-close:focus-visible {
			outline: 1px solid #c97c3d;
		}

		/* The box and details follow the selected aircraft; clicks pass through so the aircraft can still be picked or deselected */
		#selection-box,
		#details,
		#loading {
			position: fixed;
			top: 0;
			left: 0;
			z-index: 1;
			pointer-events: none;
		}

		#loading {
			top: 12px;
			left: 12px;
			width: 14px;
			height: 14px;
			border: 2px solid rgba(237, 237, 237, 0.2);
			border-top-color: rgba(237, 237, 237, 0.8);
			border-radius: 50%;
			animation: spin 0.8s linear infinite;
		}

		@keyframes spin {
			to {
				transform: rotate(360deg);
			}
		}

		#selection-box {
			box-sizing: border-box;
			border: 1px solid #c97c3d;
			box-shadow: 0 0 8px rgba(201, 124, 61, 0.5);
		}

		#details {
			box-sizing: border-box;
			width: 260px;
			border: 1px solid rgba(237, 237, 237, 0.2);
			border-left: 2px solid #c97c3d;
			background: rgba(24, 24, 24, 0.9);
			color: #ededed;
			font: 12px/1.6 ui-monospace, monospace;
		}

		#details[hidden] {
			display: none;
		}

		#groups > *,
		#summary {
			padding: 10px 12px;
		}

		#groups > * + *,
		#summary {
			border-top: 1px solid rgba(237, 237, 237, 0.2);
		}

		/* Arrives last, so it cannot shift the data above it */
		#summary {
			color: rgba(237, 237, 237, 0.6);
			font-size: 11px;
		}

		#summary svg {
			float: left;
			width: 12px;
			height: 12px;
			margin: 3px 6px 0 0;
			fill: rgba(237, 237, 237, 0.6);
		}

		#details h2 {
			margin: 0;
			font-size: 18px;
			font-weight: 600;
			letter-spacing: 0.04em;
		}

		#details p {
			margin: 0;
			color: rgba(237, 237, 237, 0.4);
		}

		#details dl {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 10px 16px;
			margin: 0;
		}

		#details dt {
			color: rgba(237, 237, 237, 0.4);
			font-size: 10px;
			letter-spacing: 0.12em;
			text-transform: uppercase;
		}

		#details dd {
			margin: 0;
			font-variant-numeric: tabular-nums;
		}

		/* Altitude and speed, the two values compared most */
		#details dl > :nth-child(-n + 2) dd {
			font-size: 18px;
			line-height: 1.4;
		}

		#details dd::after {
			content: " " attr(data-unit);
			color: rgba(237, 237, 237, 0.4);
			font-size: 11px;
		}
	</style>
</head>

<body>
	<main id="viewer"></main>
	<div id="loading" role="status" aria-label="Loading aircraft"></div>
	<div id="controls">
		<button id="compass" aria-label="Reset north">
			<svg viewBox="0 0 30 30">
				<path d="M15 5l4 10h-8z" fill="#c97c3d" />
				<path d="M15 25l-4-10h8z" fill="#ededed" fill-opacity="0.4" />
			</svg>
		</button>
	</div>
	<div id="selection-box" hidden></div>
	<aside id="details" hidden>
		<div id="groups"></div>
		<div id="summary" hidden></div>
	</aside>

	<script src="https://cdn.jsdelivr.net/npm/cesium@1.145.0/Build/Cesium/Cesium.js"></script>
	<script>
		async function fetchAircraft() {
			const response = await fetch('/api/latest-flight-state');
			if (!response.ok) {
				throw new Error(`Latest flight state request failed: ${response.status}`);
			}
			const data = await response.json();
			const columns = (data.manifest?.schema?.columns ?? []).map(({ name }) => name);
			// Number(null) is 0, which would turn a missing velocity into a vertical climb
			const optionalNumber = (value) => (value == null ? null : Number(value));
			return (data.result?.data_array ?? [])
				.map((values) => Object.fromEntries(values.map((value, index) => [columns[index], value])))
				.filter((row) => row.longitude != null && row.latitude != null && row.geo_altitude != null)
				.map((row) => {
					const [longitude, latitude, altitude] = [row.longitude, row.latitude, row.geo_altitude].map(Number);
					const rate = optionalNumber(row.vertical_rate);
					const speed = optionalNumber(row.velocity);
					return {
						longitude,
						latitude,
						altitude,
						position: Cesium.Cartesian3.fromDegrees(longitude, latitude, altitude),
						model: findAircraftModel(row.category),
						category: row.category,
						heading: optionalNumber(row.true_track) ?? 0,
						speed,
						verticalRate: rate,
						icao24: row.icao24,
						callsign: row.callsign?.trim() || null,
						pitch: rate == null || speed == null ? 0 : Math.atan2(rate, speed),
					};
				});
		}

		// Categories are the labels the gold table delivers, not OpenSky's numeric codes
		const aircraftModels = [
			{
				// Too little is known about these to pick a shape, so they stay markers
				file: null,
				categories: [
					'No information',
					'No ADS-B emitter category information',
					'Parachutist / skydiver',
					'Reserved',
					'Space / trans-atmospheric vehicle',
					'Surface vehicle - emergency vehicle',
					'Surface vehicle - service vehicle',
					'Point obstacle',
					'Cluster obstacle',
					'Line obstacle',
				],
				drawLengthMeters: 720,
			},
			{ file: 'light', categories: ['Light'], drawLengthMeters: 2100 },
			{ file: 'small', categories: ['Small'], drawLengthMeters: 3300 },
			{ file: 'airliner', categories: ['Large', 'High vortex large'], drawLengthMeters: 4500 },
			{ file: 'heavy', categories: ['Heavy'], drawLengthMeters: 6000 },
			{ file: 'fighter', categories: ['High performance'], drawLengthMeters: 3000 },
			{ file: 'helicopter', categories: ['Rotorcraft'], drawLengthMeters: 2700 },
			{ file: 'glider', categories: ['Glider / sailplane'], drawLengthMeters: 2700 },
			{ file: 'airship', categories: ['Lighter-than-air'], drawLengthMeters: 5400 },
			{ file: 'hang-glider', categories: ['Ultralight / hang-glider / paraglider'], drawLengthMeters: 2400 },
			{ file: 'drone', categories: ['Unmanned aerial vehicle'], drawLengthMeters: 500 },
		];

		function findAircraftModel(category) {
			const model = aircraftModels.find(({ categories }) => categories.includes(category ?? 'No information'));
			if (!model) {
				throw new Error(`Unknown aircraft category: ${category}`);
			}
			return model;
		}

		async function loadBasemapStyle() {
			const response = await fetch('https://tiles.openfreemap.org/styles/dark');
			if (!response.ok) {
				throw new Error(`Basemap style request failed: ${response.status}`);
			}
			const style = await response.json();
			const layer = (id) => style.layers.find((entry) => entry.id === id);
			const setPaint = (id, values) => Object.assign((layer(id).paint ??= {}), values);
			const setLayout = (id, values) => Object.assign((layer(id).layout ??= {}), values);
			const addLayer = (definition, beforeId) => style.layers.splice(style.layers.findIndex(({ id }) => id === beforeId), 0, definition);

			// Road labels compete with city names, which matter more when tracking flights
			['highway_name_other', 'highway_name_motorway', 'road_oneway', 'road_oneway_opposite'].forEach((id) => setLayout(id, { visibility: 'none' }));

			// The layer references a pattern that is missing from the style's sprite, so it never draws and MapLibre logs a warning on every load
			setLayout('landcover_wood', { visibility: 'none' });

			// Lifts the stock dark palette a notch
			setPaint('background', { 'background-color': '#181818' });
			setPaint('water', { 'fill-color': '#262628' });

			// Runways are near-black in the stock style, so they are invisible against the dark basemap
			setPaint('aeroway-runway', { 'line-color': '#a8a8a8' });
			setPaint('aeroway-area', { 'fill-color': '#a8a8a8' });
			setPaint('aeroway-runway-casing', { 'line-color': '#4a4a4a' });
			// The style starts these at zoom 11, but the tiles carry aeroway data from zoom 10
			['aeroway-runway', 'aeroway-runway-casing'].forEach((id) => Object.assign(layer(id), { minzoom: 10, maxzoom: 24 }));

			// The tiles have no runways below zoom 10; to keep major runways visible, they are drawn from OpenStreetMap data that Claude generated into runways.geojson
			style.sources['runways-low-zoom'] = { type: 'geojson', data: new URL('/runways.geojson', location.href).href };
			addLayer(
				{
					id: 'runways-low-zoom',
					type: 'line',
					source: 'runways-low-zoom',
					minzoom: 4,
					maxzoom: 10,
					paint: { 'line-color': '#a8a8a8', 'line-width': ['interpolate', ['linear'], ['zoom'], 4, 0.75, 10, 2] },
				},
				'aeroway-runway',
			);

			// These layers reference an icon that is missing from the style's sprite, so MapLibre logs a console warning for each; clearing it silences that
			['place_town', 'place_city', 'place_city_large'].forEach((id) => setLayout(id, { 'icon-image': '' }));

			// Anything smaller than a city only shows once zoomed in
			const placeMinZoom = { place_state: 6, place_city: 5, place_town: 10, place_village: 12, place_other: 12, place_suburb: 12 };
			style.layers
				.filter(({ id }) => id.startsWith('place_'))
				.forEach(({ id }) => {
					setPaint(id, { 'text-color': '#8a8a8a' });
					if (id in placeMinZoom) {
						layer(id).minzoom = placeMinZoom[id];
					}
				});

			style.sources.hillshade = {
				type: 'raster-dem',
				tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],
				// The tiles are 256 pixels, but declaring 512 makes MapLibre fetch one per rendered tile instead of four
				tileSize: 512,
				maxzoom: 15,
				encoding: 'terrarium',
			};
			// Inserted below the waterway, road and label layers so shading never covers them
			addLayer({ id: 'hillshade', type: 'hillshade', source: 'hillshade', paint: { 'hillshade-exaggeration': 0.4, 'hillshade-highlight-color': '#3d4b5c' } }, 'waterway');

			// Cesium shows a tile at about 512 device pixels, so on a high-DPI screen the style's CSS pixel sizes would come out that many times smaller
			const scale = window.devicePixelRatio;
			const scaleSize = (size) => {
				if (typeof size === 'number') {
					return size * scale;
				}
				if (size[0] === 'interpolate') {
					return size.map((entry, index) => (index >= 4 && index % 2 === 0 ? entry * scale : entry));
				}
				throw new Error(`Unsupported size expression: ${JSON.stringify(size)}`);
			};
			style.layers
				.filter(({ type }) => type === 'symbol')
				.forEach((entry) => {
					if (entry.layout?.['text-size'] !== undefined) {
						entry.layout['text-size'] = scaleSize(entry.layout['text-size']);
					}
					if (entry.paint?.['text-halo-width'] !== undefined) {
						entry.paint['text-halo-width'] = scaleSize(entry.paint['text-halo-width']);
					}
				});
			return style;
		}

		// Cesium only takes raster tiles, so each one is rendered offscreen by MapLibre from the vector style; the pixel ratio of 2 keeps them sharp
		class MapLibreImageryProvider extends Cesium.UrlTemplateImageryProvider {
			constructor(maplibregl, style, poolSize) {
				// The URL template is required by the parent class, but requestImage never uses it
				super({
					url: '/{z}/{x}/{y}',
					tileWidth: 512,
					tileHeight: 512,
					maximumLevel: 18,
					// OpenFreeMap specifies this wording and requires the links
					credit:
						'Basemap: <a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> <a href="https://www.openmaptiles.org/" target="_blank">© OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>',
				});
				this._idleMaps = Array.from({ length: poolSize }, () => {
					const container = document.createElement('div');
					container.style.cssText = 'position: fixed; left: -10000px; width: 512px; height: 512px';
					document.body.append(container);
					return new maplibregl.Map({ container, style, interactive: false, attributionControl: false, fadeDuration: 0, pixelRatio: 2 });
				});
			}

			requestImage(x, y, level) {
				const map = this._idleMaps.pop();
				// Returning nothing makes Cesium ask again later, nearest tiles first; queueing here would render tiles that have since left the view before the ones in view
				if (!map) {
					return undefined;
				}
				const tileCount = 2 ** level;
				const lng = ((x + 0.5) / tileCount) * 360 - 180;
				const lat = (Math.atan(Math.sinh(Math.PI * (1 - (2 * (y + 0.5)) / tileCount))) * 180) / Math.PI;
				return new Promise((resolve, reject) => {
					// The canvas is copied inside the event, before the browser can clear its drawing buffer; Cesium expects bitmaps already flipped
					map.once('idle', () => createImageBitmap(map.getCanvas(), { imageOrientation: 'flipY' }).then(resolve, reject));
					map.jumpTo({ center: [lng, lat], zoom: level });
					map.triggerRepaint();
				}).finally(() => {
					this._idleMaps.push(map);
					// A finished tile does not draw a frame by itself, and it is the next frame that retries the tiles that were told to wait
					scene.requestRender();
				});
			}
		}

		const viewer = new Cesium.Viewer('viewer', {
			// The default base layer and terrain need a Cesium ion token; the base layer is added below
			baseLayer: false,
			animation: false,
			baseLayerPicker: false,
			fullscreenButton: false,
			geocoder: false,
			infoBox: false,
			navigationHelpButton: false,
			sceneModePicker: false,
			selectionIndicator: false,
			timeline: false,
			// Cesium otherwise ignores the display's pixel ratio, so the globe renders at half resolution on high-DPI screens
			useBrowserRecommendedResolution: false,
		});
		const { scene, camera } = viewer;
		// The models are CC BY 3.0, which requires crediting the authors
		viewer.creditDisplay.addStaticCredit(
			new Cesium.Credit(
				'Aircraft models: Poly by Google, Silly Fear, Yogoshimo 2.0, Miha Lunar, jeremy, Vojtěch Balák, Eik Røgeberg via Poly Pizza, <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank">CC BY 3.0</a>, modified (<a href="/models/CREDITS.md" target="_blank">details</a>)',
			),
		);
		viewer.creditDisplay.addStaticCredit(new Cesium.Credit('Flight data: <a href="https://opensky-network.org/" target="_blank">OpenSky Network</a>'));
		viewer.creditDisplay.addStaticCredit(new Cesium.Credit('Globe: <a href="https://cesium.com/platform/cesiumjs/" target="_blank">CesiumJS</a>'));
		// The link leads to the full list of elevation datasets the tiles require crediting
		viewer.creditDisplay.addStaticCredit(
			new Cesium.Credit('Terrain: <a href="https://github.com/tilezen/joerd/blob/master/docs/attribution.md" target="_blank">Mapzen, AWS Terrain Tiles</a>'),
		);
		Promise.all([import('https://cdn.jsdelivr.net/npm/maplibre-gl@6.10.0/dist/maplibre-gl.mjs'), loadBasemapStyle()]).then(([maplibregl, style]) => {
			viewer.imageryLayers.addImageryProvider(new MapLibreImageryProvider(maplibregl, style, 3));
		});
		// The default of 2 picks coarser imagery levels, which then show up magnified and blurry
		scene.globe.maximumScreenSpaceError = 1;
		scene.globe.baseColor = Cesium.Color.fromCssColorString('#181818');
		// Performance: the scene is static most of the time, so frames are only drawn when the camera moves or a tile loads; changes made from code need scene.requestRender()
		scene.requestRenderMode = true;
		scene.globe.showGroundAtmosphere = false;
		scene.skyAtmosphere.show = false;
		scene.skyBox.show = false;
		scene.sun.show = false;
		scene.moon.show = false;
		scene.backgroundColor = Cesium.Color.fromCssColorString('#181818');

		// Right-drag zooms by default; here it tilts and rotates like the map's right-drag did
		Object.assign(scene.screenSpaceCameraController, {
			zoomEventTypes: [
				Cesium.CameraEventType.WHEEL,
				Cesium.CameraEventType.PINCH,
				// Touchpad pinch reaches the page as a wheel event with Ctrl held
				{ eventType: Cesium.CameraEventType.WHEEL, modifier: Cesium.KeyboardEventModifier.CTRL },
			],
			tiltEventTypes: [
				Cesium.CameraEventType.RIGHT_DRAG,
				Cesium.CameraEventType.MIDDLE_DRAG,
				Cesium.CameraEventType.PINCH,
				{ eventType: Cesium.CameraEventType.LEFT_DRAG, modifier: Cesium.KeyboardEventModifier.CTRL },
			],
		});

		// Testing showed touchpads require higher sensitivity than mouse scrolls
		viewer.canvas.addEventListener('wheel', (event) => {
			const mouseWheel = !event.ctrlKey && (event.deltaMode !== WheelEvent.DOM_DELTA_PIXEL || Math.abs(event.deltaY) >= 100);
			scene.screenSpaceCameraController.zoomFactor = mouseWheel ? 5 : 12.5;
		});

		// Straight down with north up, high enough that the whole globe fits with room around it on a landscape screen
		const homeView = { destination: Cesium.Cartesian3.fromDegrees(18.1, 37.5, 25_000_000) };
		camera.setView(homeView);

		// Beyond this distance a model is only a few pixels, so markers take over
		const modelRangeMeters = 500_000;
		// Evaluated by Cesium every frame, so an aircraft is never drawn as both, however stale the loading below is
		const modelDisplayRange = new Cesium.DistanceDisplayCondition(0, modelRangeMeters);
		const markerDisplayRange = new Cesium.DistanceDisplayCondition(modelRangeMeters, Number.MAX_VALUE);
		// Models start loading a little before they become visible, so they are ready when the camera arrives
		const modelLoadRangeMeters = modelRangeMeters * 1.1;
		const models = new Map();
		const modelFailures = new Set();
		const markerOf = new Map();
		// Shared, so an aircraft does not change color when it switches between a marker and a model
		const aircraftColor = Cesium.Color.fromCssColorString('#8a8a86');

		function modelMatrix(aircraft) {
			// The models' nose points along -Z, which Cesium turns into -X, so the nose is opposite the frame's forward axis:
			// the heading is measured clockwise from east instead of north, and a climb needs a negative pitch
			const orientation = new Cesium.HeadingPitchRoll(Cesium.Math.toRadians(aircraft.heading) + Cesium.Math.PI_OVER_TWO, -aircraft.pitch, 0);
			return Cesium.Transforms.headingPitchRollToFixedFrame(aircraft.position, orientation);
		}

		function showModel(aircraft) {
			const { file, drawLengthMeters } = aircraft.model;
			const model = Cesium.Model.fromGltfAsync({
				id: aircraft,
				url: `/models/${file}.glb`,
				modelMatrix: modelMatrix(aircraft),
				scale: drawLengthMeters,
				distanceDisplayCondition: modelDisplayRange,
				minimumPixelSize: 2,
				color: aircraftColor,
				// The default mode multiplies the tint with each model's own tones, so only their lightest parts would get the exact color
				colorBlendMode: Cesium.ColorBlendMode.REPLACE,
				// Thin surfaces such as wings are single-sided and vanish from above otherwise
				backFaceCulling: false,
			}).then(
				(loaded) => {
					scene.primitives.add(loaded);
					scene.requestRender();
					return loaded;
				},
				(error) => {
					console.error(`Model ${file}.glb failed to load for aircraft ${aircraft.icao24}`, error);
					modelFailures.add(aircraft);
					markerOf.get(aircraft).distanceDisplayCondition = undefined;
					scene.requestRender();
					return null;
				},
			);
			models.set(aircraft, model);
		}

		function hideModel(aircraft) {
			models.get(aircraft).then((model) => {
				if (model) {
					scene.primitives.remove(model);
				}
			});
			models.delete(aircraft);
		}

		// Leaves room around the aircraft for its marker and details
		const inspectLengthPixels = 150;

		let selected = null;

		// Points straight down from the selected aircraft, showing what it is flying over
		const groundLine = scene.primitives.add(new Cesium.PolylineCollection()).add({
			show: false,
			width: 2,
			material: Cesium.Material.fromType('Color', { color: Cesium.Color.fromCssColorString('#c97c3d') }),
		});

		const selectionBox = document.getElementById('selection-box');
		const details = document.getElementById('details');
		const groups = document.getElementById('groups');
		const summary = document.getElementById('summary');
		// Keeps the box visible when the aircraft is only a marker
		const minimumBoxPixels = 24;
		const boxPaddingPixels = 6;
		const detailsGapPixels = 12;

		function showDetails(aircraft) {
			const value = (number, scale = 1) => (number == null ? null : Math.round(number * scale).toLocaleString('en-US'));
			const rate = aircraft.verticalRate == null ? null : Math.round(aircraft.verticalRate);
			const arrow = rate > 0 ? '▲ ' : rate < 0 ? '▼ ' : '';
			// The aircraft itself first, then what it is doing right now
			const identity = document.createElement('div');
			const callsign = document.createElement('h2');
			callsign.textContent = aircraft.callsign ?? '—';
			const registration = document.createElement('p');
			registration.textContent = `${aircraft.icao24} · ${aircraft.category ?? '—'}`;
			identity.append(callsign, registration);
			const state = document.createElement('dl');
			for (const [label, text, unit] of [
				['Altitude', value(aircraft.altitude), 'm'],
				['Speed', value(aircraft.speed, 3.6), 'km/h'],
				['Heading', value(aircraft.heading), '°'],
				['Vertical rate', rate == null ? null : arrow + Math.abs(rate), 'm/s'],
			]) {
				const term = document.createElement('dt');
				term.textContent = label;
				const description = document.createElement('dd');
				description.textContent = text ?? '—';
				if (text != null) {
					description.dataset.unit = unit;
				}
				const cell = document.createElement('div');
				cell.append(term, description);
				state.append(cell);
			}
			groups.replaceChildren(identity, state);
			summary.hidden = true;
			summary.replaceChildren();
			// Shown once it arrives, unless the aircraft was deselected meanwhile or has no summary
			fetch(`/api/aircraft-summary?icao24=${encodeURIComponent(aircraft.icao24)}`)
				.then(async (response) => {
					if (!response.ok) {
						throw new Error(`Aircraft summary request failed: ${response.status}`);
					}
					return (await response.json()).summary;
				})
				.catch((error) => {
					console.error(error);
					return 'Summary unavailable';
				})
				.then((text) => {
					if (text && selected === aircraft) {
						summary.innerHTML = '<svg viewBox="0 0 24 24" role="img" aria-label="Generated by AI"><title>Generated by AI</title><path d="M10 2l2.5 7.5L20 12l-7.5 2.5L10 22l-2.5-7.5L0 12l7.5-2.5zM19 1l1 3 3 1-3 1-1 3-1-3-3-1 3-1z"/></svg>';
						summary.append(text);
						summary.hidden = false;
						scene.requestRender();
					}
				});
		}

		// A square around the aircraft's position, which is the center of its model; Cesium's bounding sphere of a model is off-center and too small
		function projectBox(aircraft) {
			const radius = aircraft.model.drawLengthMeters / 2;
			const edgePosition = Cesium.Cartesian3.add(aircraft.position, Cesium.Cartesian3.multiplyByScalar(camera.rightWC, radius, new Cesium.Cartesian3()), new Cesium.Cartesian3());
			const center = Cesium.SceneTransforms.worldToWindowCoordinates(scene, aircraft.position);
			const edge = Cesium.SceneTransforms.worldToWindowCoordinates(scene, edgePosition);
			// Undefined when the point is behind the camera, where no box can be drawn
			if (!center || !edge) {
				return null;
			}
			const side = Math.max(2 * Math.hypot(edge.x - center.x, edge.y - center.y) + 2 * boxPaddingPixels, minimumBoxPixels);
			return { x: center.x - side / 2, y: center.y - side / 2, width: side, height: side };
		}

		// The toolbar only holds the home button; it is moved out of the viewer so it sits in the panel
		document.getElementById('controls').append(viewer.homeButton.container);
		const compassNeedle = document.querySelector('#compass svg');
		// Like the home button, this flies instead of jumping; a locked camera keeps orbiting its aircraft
		document.getElementById('compass').addEventListener('click', () => {
			if (!selected) {
				camera.flyTo({ destination: camera.positionWC, orientation: { heading: 0, pitch: camera.pitch, roll: 0 }, duration: flightDuration(camera.positionWC) });
				return;
			}
			flyAround(selected, new Cesium.HeadingPitchRange(0, camera.pitch, Cesium.Cartesian3.magnitude(camera.position)));
		});

		scene.postRender.addEventListener(() => {
			compassNeedle.style.transform = `rotate(${-camera.heading}rad)`;
			const box = selected && projectBox(selected);
			selectionBox.hidden = details.hidden = !box;
			if (!box) {
				return;
			}
			selectionBox.style.transform = `translate(${box.x}px, ${box.y}px)`;
			selectionBox.style.width = `${box.width}px`;
			selectionBox.style.height = `${box.height}px`;
			// Beside the box, on whichever side has room
			const fitsRight = box.x + box.width + detailsGapPixels + details.offsetWidth <= innerWidth - detailsGapPixels;
			const x = fitsRight ? box.x + box.width + detailsGapPixels : box.x - detailsGapPixels - details.offsetWidth;
			const y = Math.min(Math.max(box.y, detailsGapPixels), innerHeight - detailsGapPixels - details.offsetHeight);
			details.style.transform = `translate(${x}px, ${y}px)`;
		});

		// Cesium's collision detection does not reliably keep a camera locked to an aircraft above the map, so orbiting a low aircraft could end up below the ground
		const minimumCameraHeightMeters = 5;
		scene.postUpdate.addEventListener(() => {
			// A free camera is kept above the ground by Cesium; only a locked one needs this
			if (Cesium.Matrix4.equals(camera.transform, Cesium.Matrix4.IDENTITY) || camera.positionCartographic.height >= minimumCameraHeightMeters) {
				return;
			}
			const target = Cesium.Matrix4.getTranslation(camera.transform, new Cesium.Cartesian3());
			const range = Cesium.Cartesian3.magnitude(camera.position);
			const targetHeight = Cesium.Cartographic.fromCartesian(target).height;
			// Adjusting the pitch instead of the position keeps the distance to the aircraft, and an aircraft high above the ground can still be viewed from below
			const pitch = -Math.asin(Math.min((minimumCameraHeightMeters - targetHeight) / range, 1));
			camera.lookAt(target, new Cesium.HeadingPitchRange(camera.heading, pitch, range));
			scene.requestRender();
		});

		// Also unlocks the camera, so dragging pans again instead of orbiting the aircraft
		function releaseAircraft() {
			selected = null;
			groundLine.show = false;
			scene.requestRender();
			// A fly-to still in progress would otherwise lock the camera to the aircraft when it lands
			camera.cancelFlight();
			camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
		}

		// Cesium's own default duration (2 to 3 seconds, growing with the distance) made 50% shorter
		function flightDuration(destination) {
			return 0.50 * Math.min(Math.ceil(Cesium.Cartesian3.distance(camera.positionWC, destination) / 1_000_000) + 2, 3);
		}

		function flyAround(aircraft, offset) {
			camera.flyToBoundingSphere(new Cesium.BoundingSphere(aircraft.position), {
				offset,
				// The camera ends up a range away from the aircraft, which is small next to the distance flown
				duration: flightDuration(aircraft.position),
				// Locking the camera to the aircraft makes dragging orbit around it
				complete: () => camera.lookAt(aircraft.position, offset),
			});
		}

		function centerOnAircraft(aircraft) {
			const { drawLengthMeters } = aircraft.model;
			// Pixels per meter at a distance is canvas height / (2 * distance * tan(fov / 2)), solved for the distance that gives the length
			const range = (drawLengthMeters * viewer.canvas.clientHeight) / (2 * inspectLengthPixels * Math.tan(camera.frustum.fovy / 2));
			// A camera locked to another aircraft would fly relative to that frame
			releaseAircraft();
			selected = aircraft;
			// Starting below the center keeps the line from cutting through the model's underside; the drop never goes below the ground
			const drop = Math.min(drawLengthMeters * 0.05, Math.max(aircraft.altitude, 0));
			const { longitude, latitude } = aircraft;
			groundLine.positions = Cesium.Cartesian3.fromDegreesArrayHeights([longitude, latitude, aircraft.altitude - drop, longitude, latitude, 0]);
			groundLine.show = true;
			showDetails(aircraft);
			// Keeping the current heading and pitch approaches the aircraft along the line of sight instead of snapping to a top view
			flyAround(aircraft, new Cesium.HeadingPitchRange(camera.heading, camera.pitch, range));
		}

		// The button's own destination is the default view rectangle, and flying needs the camera unlocked from any aircraft first
		viewer.homeButton.viewModel.command.beforeExecute.addEventListener((command) => {
			command.cancel = true;
			releaseAircraft();
			camera.flyTo({ ...homeView, duration: flightDuration(homeView.destination) });
		});

		const loading = document.getElementById('loading');
		fetchAircraft().then((aircraft) => {
			const markers = scene.primitives.add(new Cesium.BillboardCollection());
			const modeled = aircraft.filter((entry) => entry.model.file !== null);
			// Applied by the GPU, so it costs nothing per marker; sizes are multiples of the base size, blended linearly between the two distances.
			// At the model range a marker is about as long as the model that replaces it, so markers along a low camera's horizon are not drawn larger than the models in front of them
			const markerScaleByDistance = new Cesium.NearFarScalar(modelRangeMeters, 0.5, 20_000_000, 0.3);
			// White, so the color tint below gives the exact color; the tip points up, the direction alignedAxis lines up with
			const triangleImage = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 32'><path d='M8 1L15 31H1z' fill='white'/></svg>";
			// Aircraft without a model are always markers, at any distance
			aircraft.forEach((entry) => {
				const heading = Cesium.Math.toRadians(entry.heading);
				// A direction in world space, so the marker keeps pointing along the true heading and climb however the camera turns
				const direction = Cesium.Matrix4.multiplyByPointAsVector(
					Cesium.Transforms.eastNorthUpToFixedFrame(entry.position),
					new Cesium.Cartesian3(Math.sin(heading) * Math.cos(entry.pitch), Math.cos(heading) * Math.cos(entry.pitch), Math.sin(entry.pitch)),
					new Cesium.Cartesian3(),
				);
				const marker = markers.add({
					id: entry,
					position: entry.position,
					image: triangleImage,
					width: 11.25,
					height: 24.75,
					alignedAxis: direction,
					scaleByDistance: markerScaleByDistance,
					distanceDisplayCondition: entry.model.file === null ? undefined : markerDisplayRange,
					color: aircraftColor,
				});
				markerOf.set(entry, marker);
			});
			// Nothing requests a frame when the image finishes loading, so the markers would stay invisible until the camera moves
			const removeReadyCheck = scene.preUpdate.addEventListener(() => {
				if (!markers.length || markers.get(0).ready) {
					removeReadyCheck();
					loading.hidden = true;
					scene.requestRender();
				}
			});
			scene.requestRender();

			const updateModels = () => {
				for (const entry of modeled) {
					if (modelFailures.has(entry)) {
						continue;
					}
					const near = Cesium.Cartesian3.distance(camera.positionWC, entry.position) < modelLoadRangeMeters;
					if (near && !models.has(entry)) {
						showModel(entry);
					} else if (!near && models.has(entry)) {
						hideModel(entry);
					}
				}
			};
			camera.percentageChanged = 0.1;
			camera.changed.addEventListener(updateModels);
			camera.moveEnd.addEventListener(updateModels);
			updateModels();

			new Cesium.ScreenSpaceEventHandler(viewer.canvas).setInputAction(({ position }) => {
				// Only aircraft carry an id
				const picked = scene.pick(position)?.id;
				if (picked) {
					centerOnAircraft(picked);
				} else if (selected) {
					releaseAircraft();
				}
			}, Cesium.ScreenSpaceEventType.LEFT_CLICK);
			document.addEventListener('keydown', (event) => {
				if (event.key === 'Escape' && selected) {
					releaseAircraft();
				}
			});
		}).catch((error) => {
			// A spinner that never ends would claim the aircraft are still on their way
			loading.hidden = true;
			throw error;
		});
	</script>
</body>

</html>
