<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="520" height="420" fill="#fbfbfa" stroke="#d0d0cc" stroke-width="1"/>

  <text x="260" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#222">
    OpenSky ingestion bounding box (≈ Belgium)
  </text>

  <!-- plot area = the bounding box itself: x maps longitude, y maps latitude -->
  <!-- lon 2.54 -> x=60, lon 6.41 -> x=460 | lat 49.50 -> y=360, lat 51.51 -> y=40 -->

  <!-- gridlines -->
  <g stroke="#e3e3df" stroke-width="1">
    <line x1="122" y1="40" x2="122" y2="360"/> <!-- lon 3 -->
    <line x1="225" y1="40" x2="225" y2="360"/> <!-- lon 4 -->
    <line x1="328" y1="40" x2="328" y2="360"/> <!-- lon 5 -->
    <line x1="432" y1="40" x2="432" y2="360"/> <!-- lon 6 -->
    <line x1="60" y1="201" x2="460" y2="201"/> <!-- lat 50.5 -->
    <line x1="60" y1="42" x2="460" y2="42"/>   <!-- lat 51.5 -->
  </g>
  <g font-size="10" fill="#999">
    <text x="122" y="374" text-anchor="middle">3°</text>
    <text x="225" y="374" text-anchor="middle">4°</text>
    <text x="328" y="374" text-anchor="middle">5°</text>
    <text x="432" y="374" text-anchor="middle">6°</text>
    <text x="50" y="205" text-anchor="end">50.5°</text>
    <text x="50" y="46" text-anchor="end">51.5°</text>
  </g>

  <!-- the bounding box -->
  <rect x="60" y="40" width="400" height="320" fill="#eaf2fb" stroke="#3568b5" stroke-width="2"/>

  <!-- corner coordinate labels -->
  <g font-size="11" fill="#3568b5" font-weight="600">
    <text x="64" y="356">(49.50, 2.54)</text>
    <text x="456" y="356" text-anchor="end">(49.50, 6.41)</text>
    <text x="64" y="52">(51.51, 2.54)</text>
    <text x="456" y="52" text-anchor="end">(51.51, 6.41)</text>
  </g>

  <!-- cities for orientation -->
  <g font-size="11" fill="#333">
    <circle cx="99" cy="86" r="3.5" fill="#c0392b"/>
    <text x="92" y="80" text-anchor="end">Ostend</text>

    <circle cx="130" cy="88" r="3.5" fill="#c0392b"/>
    <text x="137" y="85">Bruges</text>

    <circle cx="182" cy="113" r="3.5" fill="#c0392b"/>
    <text x="189" y="110">Ghent</text>

    <circle cx="134" cy="148" r="3.5" fill="#c0392b"/>
    <text x="141" y="145">Kortrijk</text>

    <circle cx="252" cy="86" r="3.5" fill="#c0392b"/>
    <text x="259" y="83">Antwerp</text>

    <circle cx="247" cy="145" r="3.5" fill="#c0392b"/>
    <text x="254" y="142">Brussels</text>

    <circle cx="283" cy="140" r="3.5" fill="#c0392b"/>
    <text x="290" y="153">Leuven</text>

    <circle cx="349" cy="132" r="3.5" fill="#c0392b"/>
    <text x="356" y="129">Hasselt</text>

    <circle cx="373" cy="180" r="3.5" fill="#c0392b"/>
    <text x="380" y="177">Liège</text>

    <circle cx="206" cy="209" r="3.5" fill="#c0392b"/>
    <text x="213" y="206">Mons</text>

    <circle cx="256" cy="215" r="3.5" fill="#c0392b"/>
    <text x="263" y="212">Charleroi</text>

    <circle cx="301" cy="206" r="3.5" fill="#c0392b"/>
    <text x="308" y="203">Namur</text>

    <circle cx="399" cy="331" r="3.5" fill="#c0392b"/>
    <text x="406" y="328">Arlon</text>
  </g>

  <text x="260" y="404" text-anchor="middle" font-size="11" fill="#666">
    x = longitude (BB_LON_MIN .. BB_LON_MAX)     y = latitude (BB_LAT_MIN .. BB_LAT_MAX)
  </text>
</svg>
